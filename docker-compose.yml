services:
  regimes:
    build:
      context: .
      args:
        # Override with `UID=$(id -u) GID=$(id -g) docker compose build` if your
        # host account is not 1000:1000.
        UID: "${UID:-1000}"
        GID: "${GID:-1000}"
    image: seasonregimes-pt:local
    working_dir: /app
    volumes:
      # Downloaded ERA5 Z500 and CEMS FWI reanalysis.
      - ./data:/app/data
      # Fitted regimes, pickled state, comparison tables.
      - ./out:/app/out
      # CDS credentials, read-only and never baked into the image.
      # This file must already exist on the host or Docker will create a
      # directory in its place and cdsapi will fail with a confusing error.
      - ${HOME}/.cdsapirc:/home/regimes/.cdsapirc:ro
    command: ["python", "run_prototype.py", "--help"]

  # Same image and environment, but with the working tree mounted over /app so
  # code edits take effect immediately. Use this while iterating - notably when
  # correcting drifted CDS dataset identifiers in regimes_pt/download.py, where
  # rebuilding the image between one-line changes is pure overhead.
  #
  # Prefer the `regimes` service for anything whose result you intend to report:
  # it runs the code baked into the image, so the run is reproducible from the
  # image alone rather than depending on your uncommitted working tree.
  dev:
    extends:
      service: regimes
    volumes:
      - .:/app
      - ${HOME}/.cdsapirc:/home/regimes/.cdsapirc:ro
